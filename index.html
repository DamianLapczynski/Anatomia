<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anatomia 3D">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Anatomia 3D</title>
<script>try{var t=new URLSearchParams(location.search).get('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="app" data-mode="atlas">
  <header id="top">
    <button id="menuBtn" class="icon" aria-label="Warstwy">☰</button>
    <div class="brand">Anatomia<span>3D</span></div>
    <div id="searchbox">
      <input id="q" type="search" autocomplete="off" placeholder="Szukaj: mięsień, kość, nerw, tętnica… (PL / łac. / ang.)">
      <div id="results" hidden></div>
    </div>
    <button id="keysBtn" class="icon" title="Skróty klawiszowe (?)" aria-label="Skróty klawiszowe">⌨</button>
    <button id="setBtn" class="icon" aria-label="Ustawienia" title="Ustawienia">⚙</button>
    <nav id="modes">
      <button data-mode="atlas" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.6" r="2.3"/><path d="M5 9h14M12 9v6m0 0-3 6.5M12 15l3 6.5"/></svg>Atlas</button>
      <button data-mode="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5C5.8 4 9 4 12 6c3-2 6.2-2 9-.5v13c-2.8-1.5-6-1.5-9 .5-3-2-6.2-2-9-.5z"/><path d="M12 6v13"/></svg>Nauka</button>
      <button data-mode="motion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="4.5" r="2.2"/><path d="M6 11l4-3 4 1.5 2 4h3M10 8l-1.5 6.5L12 17v4.5M8.5 14.5 6 21"/></svg>Ruch</button>
      <button data-mode="clinic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v6a4 4 0 0 0 8 0V3"/><path d="M10 13v2.5a4.5 4.5 0 0 0 9 0V13"/><circle cx="19" cy="11" r="2"/></svg>Klinika</button>
    <button data-mode="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.4 9.3a2.7 2.7 0 0 1 5.2 1c0 1.8-2.6 2.3-2.6 3.9"/><circle cx="12" cy="17.2" r=".6" fill="currentColor"/></svg>Quiz</button>
      <button data-mode="srs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4.5h-4.5"/><path d="M12 8v4.3l2.8 1.7"/></svg>Powtórki<span id="dueBadge" hidden></span></button>
    </nav>
  </header>
  <div id="settings" hidden></div>
  <aside id="left"></aside>
  <main id="stage">
    <canvas id="c"></canvas>
    <div id="marks"></div>
    <div id="hud">
      <button data-view="front" title="Przód">Przód</button><button data-view="back" title="Tył">Tył</button>
      <button data-view="right" title="Prawy bok">P</button><button data-view="left" title="Lewy bok">L</button>
      <button data-act="home" title="Cała sylwetka">⌂</button>
    </div>
    <div id="hint"></div>
    <div id="loading"><div class="spin"></div><span>Wczytywanie modelu…</span></div>
  </main>
  <aside id="panel"><button id="grip" aria-label="Zwiń / rozwiń panel"></button><div id="panelBody"></div></aside>
</div>
<script type="module" src="./src/app.js"></script>
</body>
</html>
