<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Anatomia 3D</title>
<style>html,body{margin:0;height:100%;background:#12161d}#stage{position:fixed;inset:0}canvas{width:100%;height:100%;display:block}</style>
</head>
<body><div id="stage"><canvas id="c"></canvas></div>
<script type="module">
import { Engine } from './src/engine.js';
const e = new Engine(document.getElementById('c'));
await e.init();
await e.ensureAll(['skeleton','muscles']);
e.apply((m) => (m.f==='skeleton' ? 'base:bones' : m.f==='muscles' && !['Bursa','Fascia','Articular capsule','Ligament'].includes(m.mat) ? (m.s==='l'?'base:muscles':null) : null));
window.e = e; window.ready = true;
</script></body></html>
