<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1319">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anatomia 3D">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Anatomia 3D</title>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="app" data-mode="atlas">
  <header id="top">
    <button id="menuBtn" class="icon" aria-label="Warstwy">☰</button>
    <div class="brand">Anatomia<span>3D</span></div>
    <div id="searchbox">
      <input id="q" type="search" autocomplete="off" placeholder="Szukaj: mięsień, kość, nerw, tętnica… (PL / łac. / ang.)">
      <div id="results" hidden></div>
    </div>
    <nav id="modes">
      <button data-mode="atlas" class="on">Atlas</button>
      <button data-mode="motion">Ruch</button>
      <button data-mode="quiz">Quiz</button>
      <button data-mode="srs">Powtórki<span id="dueBadge" hidden></span></button>
    </nav>
  </header>
  <aside id="left"></aside>
  <main id="stage">
    <canvas id="c"></canvas>
    <div id="marks"></div>
    <div id="hud">
      <button data-view="front" title="Przód">Przód</button><button data-view="back" title="Tył">Tył</button>
      <button data-view="right" title="Prawy bok">P</button><button data-view="left" title="Lewy bok">L</button>
      <button data-act="home" title="Cała sylwetka">⌂</button>
    </div>
    <div id="hint"></div>
    <div id="loading"><div class="spin"></div><span>Wczytywanie modelu…</span></div>
  </main>
  <aside id="panel"><button id="grip" aria-label="Zwiń / rozwiń panel"></button><div id="panelBody"></div></aside>
</div>
<script type="module" src="./src/app.js"></script>
</body>
</html>
